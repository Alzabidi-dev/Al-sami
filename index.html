<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البرنامج السامي | نظام إدارة المقاولات</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #1E1E1E;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }
        h1 {
            color: #FF9800;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: bold;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        .btn {
            background-color: #E65100;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            display: block;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(230, 81, 0, 0.3);
        }
        .btn:hover {
            background-color: #FF5722;
            transform: translateY(-2px);
        }
        .logo {
            width: 100px;
            height: 100px;
            background-color: #333;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #FF9800;
            font-size: 40px;
        }
        .version {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🏗️</div>
        <h1>البرنامج السامي</h1>
        <p>نظام ذكي لإبتكار العمال والتقارير والمصروفات والمراسلات.<br>تطبيق متخصص للمقاولات الداخلية والتشطيبات.</p>
       
        <!-- هذا الزر سنقوم بربطه بملف التطبيق لاحقاً -->
        <a href="#" class="btn">تحميل التطبيق (APK)</a>
       
        <div class="version">الإصدار الأول - 2026</div>
    </div>

</body>
</html>
